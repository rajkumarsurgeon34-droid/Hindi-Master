name: Build Android APK

on:
  push:
    branches: [main, android-app]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the 90-day course data
        run: node tools/check-course.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HindiMaster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HindiMaster-apk
          path: HindiMaster.apk

      - name: Publish to Releases ("latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HindiMaster.apk \
            --target "${{ github.sha }}" \
            --title "Hindi Master - latest build" \
            --notes "Build #${{ github.run_number }} from commit ${GITHUB_SHA::7}. Download HindiMaster.apk on your phone and install it."
